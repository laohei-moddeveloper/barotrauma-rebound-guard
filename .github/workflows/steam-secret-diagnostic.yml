name: Check Steam secret mapping names
on:
  push:
    branches: [codex/rebound-guard-041-1135]
    paths: [.github/workflows/steam-secret-diagnostic.yml]
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Report Steam-related secret names only (never values)
        env:
          CONFIGURED_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python - <<'PY'
          import json,os
          names=sorted(name for name in json.loads(os.environ['CONFIGURED_SECRETS']) if 'STEAM' in name.upper())
          print('Steam-related secret names:',json.dumps(names))
          print('No credential values are printed or transmitted.')
          PY
